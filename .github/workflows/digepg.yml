          '''

          channel_count = len(re.findall(r"<channel\b", channels))
          print(f"Found {channel_count} channel definitions")
          if channel_count != 103:
              raise SystemExit(f"ERROR: Expected 103 channel definitions, found {channel_count}")

          h1, h2, h31, h32, h33, h4, h5 = "prd", "static", "di", "gita", "lb", "spectar", "tv"
          host = f"{h1}-{h2}-{h31}{h32}{h33}.{h4}.{h5}"
          icon = f"https://{host}/rev-1665480307/image_transform.php/transform/1/instance_id/1/video_id/"
          channels = channels.replace("__ICON__", icon)

          source = source_file.read_text(encoding="utf-8", errors="replace")

          # Escape bare ampersands in source programme data while preserving
          # already-valid XML entities.
          source = re.sub(
              r"&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9A-Fa-f]+;)",
              "&amp;",
              source
          )

          # Extract only the contents inside the source <tv> element and build
          # a fresh XMLTV document around the programme data.
          tv_match = re.search(
              r"<tv\b[^>]*>(.*)</tv>\s*$",
              source,
              re.IGNORECASE | re.DOTALL
          )

          if not tv_match:
              raise SystemExit(
                  "ERROR: Could not extract the <tv> contents from the source EPG"
              )

          programmes = tv_match.group(1).strip()

          new_header = (
              '<tv source-info-name="prd-digepg.spectar.tv" '
              'generator-info-name="spectar_epg">'
          )

          guide = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              + new_header
              + "\n"
              + channels
              + "\n"
              + programmes
              + "\n</tv>\n"
          )

          # Remove only the known accidental duplicate closing tag from the
          # original channel list before channel 8650.
          guide = guide.replace(
              '</channel>\n</channel>\n<channel id="8650">',
              '</channel>\n<channel id="8650">'
          )

          output_file = Path("epg/digepg-guide.xml")
          output_file.write_text(guide, encoding="utf-8")
          print(f"Created {output_file}")
          print(f"Size: {output_file.stat().st_size} bytes")
          PY

      - name: Validate EPG XML
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          file = "epg/digepg-guide.xml"

          try:
              ET.parse(file)
              print("EPG XML is valid.")
          except Exception as e:
              print("ERROR: EPG XML is invalid:")
              print(e)
              raise
          PY

      - name: Create gzip version
        shell: bash
        run: |
          set -e

          gzip -9 -c \
            epg/digepg-guide.xml \
            > epg/digepg-guide.xml.gz

          ls -lh epg/digepg-guide.xml
          ls -lh epg/digepg-guide.xml.gz

      - name: Save digepg EPG
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            epg/digepg-guide.xml \
            epg/digepg-guide.xml.gz

          if git diff --cached --quiet; then
            echo "No EPG changes."
          else
            git commit -m "Update digepg EPG"
            git push
          fi
