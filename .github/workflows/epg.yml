name: IPKO + Sweden EPG

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */22 * * *"

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Grab EPG
        run: |
          mkdir -p epg
          npm run grab -- \
            --sites=ipko.tv,allente.se \
            --output=epg/guide.xml \
            --gzip=epg/guide.xml.gz

      - name: Save EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Discard changes to any files outside the epg/ folder so the working tree is clean
          git checkout -- .
          
          # Fetch latest changes from remote
          git fetch origin master
          
          # Stage the epg folder
          git add epg/
          
          # Pull latest changes with rebase
          git pull origin master --rebase
          
          # Commit and push changes
          git diff --cached --quiet || git commit -m "Update EPG [skip ci]"
          git push origin master
