name: IPKO + Sweden EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */22 * * *"

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Grab EPG
        run: |
          mkdir -p epg
          npm run grab -- \
            --sites=ipko.tv,allente.se \
            --output=epg/guide.xml \
            --gzip=epg/guide.xml.gz

      - name: Save EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com
          
          # Fetch the latest remote changes first without modifying working tree
          git fetch origin master
          
          # Stage the generated epg folder
          git add epg/
          
          # Try pulling with rebase against the fetched remote branch
          git pull origin master --rebase || {
            echo "Rebase failed, attempting to reset and apply cleanly..."
            git rebase --abort || true
            git reset
            git add epg/
            git pull origin master --rebase
          }
          
          # Commit and push changes if any exist
          git diff --cached --quiet || git commit -m "Update EPG [skip ci]"
          git push origin master
